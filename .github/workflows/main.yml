name: Daily Update
on:
  schedule:
    - cron: '5 1 * * *'  # 每天早上北京时间09:05更新(UTC时间为1:05)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 如果你需要权限来更新 Kubernetes 集群，这里也可以添加相关权限
      # kubernetes: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update README with timestamp
        run: |
          # 生成当前时间
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M:%S')
          BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          
          # 在 README 末尾添加或更新时间戳
          TIMESTAMP_SECTION="\n## 🕒 最后更新时间\n\n"
          TIMESTAMP_SECTION+="**UTC**: \`$UTC_TIME\`  \n"
          TIMESTAMP_SECTION+="**北京时间**: \`$BJ_TIME\`  \n\n"
          TIMESTAMP_SECTION+="> ⚡ 此时间戳由 GitHub Actions 自动更新\n"
          
          # 检查是否已经有时间戳部分
          if grep -q "## 🕒 最后更新时间" README.md; then
            sed -i '/## 🕒 最后更新时间/,/^## \|^# /{//!d}' README.md
            sed -i '/## 🕒 最后更新时间/d' README.md
          fi
          
          echo -e "$TIMESTAMP_SECTION" >> README.md

      - name: Auto commit changes to README
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto deploy by Github Actions"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: README.md

      # 添加一个步骤来更新 Kubernetes 配置文件，假设你需要修改 Kubernetes 配置文件并部署
      - name: Update Kubernetes Deployment with StartupProbe
        run: |
          # 生成包含 startupProbe 配置的 YAML 部署文件
          cat <<EOL > k8s-deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: your-deployment-name
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: your-app-name
            template:
              metadata:
                labels:
                  app: your-app-name
              spec:
                containers:
                  - name: your-container-name
                    image: your-image-name
                    ports:
                      - containerPort: 8080
                    startupProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      failureThreshold: 30
                      initialDelaySeconds: 60
                      periodSeconds: 10
          EOL

          # 应用新的部署配置到 Kubernetes 集群
          kubectl apply -f k8s-deployment.yaml

      # 其他步骤，比如清理或通知
